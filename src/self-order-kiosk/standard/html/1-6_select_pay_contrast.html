<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../resources/css/index.css">
  <title>6_결제 방법 선택</title>
</head>

<body class="high-contrast">
  <div class="container-wrap">
    <div class="container">
      <div class="container-body">

        <div class="header">
          <div class="header--main">
            <div class="button icon-btn h-80 w-240">
              <div class="icon home-icon"></div>
              <div class="text">처음으로</div>
            </div>
            <div class="header__actions">
              <div class="control-bar__sound">
                <button type="button" class="control-bar__sound-button" aria-label="음량 줄이기">
                  <span class="control-bar__sound-icon control-bar__sound-icon--minus" aria-hidden="true"></span>
                </button>
                <div class="control-bar__sound-status">
                  <span class="control-bar__sound-icon control-bar__sound-icon--volume" aria-hidden="true"></span>
                  <span class="control-bar__sound-level" aria-live="polite">5</span>
                </div>
                <button type="button" class="control-bar__sound-button" aria-label="음량 키우기">
                  <span class="control-bar__sound-icon control-bar__sound-icon--plus" aria-hidden="true"></span>
                </button>
              </div>
              <div class="btn_language"></div>

              <div class="header_button active">고대비</div>
              <div class="header_button">화면 내리기</div>
              <div class="header_button">화면확대</div>
              <div class=" btn_call_employee">
                <div class="icon"></div>
                <div class="text">직원호출</div>
              </div>
            </div>
          </div>
          <div class="header-sub">
            <div class="progress-steps">
              <div class="progress-step progress-step--completed" aria-current="step">
                <div class="progress-step__index"><span><strong>1</strong></span></div>
                <div class="progress-step__label">음료 선택</div>
              </div>
              <div class="step-divider"></div>
              <div class="progress-step progress-step--completed">
                <div class="progress-step__index"><span><strong>2</strong></span></div>
                <div class="progress-step__label">내역 확인</div>
              </div>
              <div class="step-divider"></div>
              <div class="progress-step progress-step--current">
                <div class="progress-step__index"><span><strong>3</strong></span></div>
                <div class="progress-step__label">결제하기</div>
              </div>
              <div class="step-divider"></div>
              <div class="progress-step">
                <div class="progress-step__index"><span><strong>4</strong></span></div>
                <div class="progress-step__label">결제 완료</div>
              </div>
              <div class="step-divider"></div>
              <div class="progress-step">
                <div class="progress-step__index"><span><strong>5</strong></span></div>
                <div class="progress-step__label">음료 추출</div>
              </div>
            </div>
          </div>
        </div>

        <main class="main">
          <div class="main-inner">
            <div class="main_with_title">
              <div class="title_comp">결제 방법을 선택하세요</div>
              <div class="pay_comp">
                <div class="pay_price_area">
                  <div class="label">결제 금액</div>
                  <div class="value">1,100원</div>
                </div>
                <div class="pay_type-comp">
                  <div class="button pay-type__item">
                    <div class="pay_icon card"></div>
                    <div class="pay_value">
                      신용·체크카드
                    </div>
                  </div>
                  <div class="button pay-type__item">
                    <div class="pay_icon money"></div>
                    <div class="pay_value">
                      현금(지폐)
                    </div>
                  </div>
                  <div class="button pay-type__item">
                    <div class="pay_icon mobile"></div>
                    <div class="pay_value">
                      모바일 결제
                    </div>
                  </div>
                  <div class="button pay-type__item">
                    <div class="pay_icon point"></div>
                    <div class="pay_value">
                      포인트 결제
                    </div>
                  </div>
                </div>
              </div>
              <div class="nav-btn-layer">
                <div class="button btn_go_back button_border_wh w-300 h-110">
                  <div class="icon"></div>
                  <div class="text">이전</div>
                </div>
              </div>
            </div>
          </div>
        </main>

      </div>
    </div>
  </div>
</body>

</html>
