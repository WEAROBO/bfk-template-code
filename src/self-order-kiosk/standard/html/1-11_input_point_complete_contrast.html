<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../resources/css/index.css">
  <title>11_포인트 적립 입력 완료</title>
</head>

<body class="high-contrast">
  <div class="container-wrap">
    <div class="container">
      <div class="container-body">

        <div class="header">
          <div class="header--main">
            <div class="button icon-btn h-80 w-240">
              <div class="icon home-icon"></div>
              <div class="text">처음으로</div>
            </div>
            <div class="header__actions">
              <div class="control-bar__sound">
                <button type="button" class="control-bar__sound-button" aria-label="음량 줄이기">
                  <span class="control-bar__sound-icon control-bar__sound-icon--minus" aria-hidden="true"></span>
                </button>
                <div class="control-bar__sound-status">
                  <span class="control-bar__sound-icon control-bar__sound-icon--volume" aria-hidden="true"></span>
                  <span class="control-bar__sound-level" aria-live="polite">5</span>
                </div>
                <button type="button" class="control-bar__sound-button" aria-label="음량 키우기">
                  <span class="control-bar__sound-icon control-bar__sound-icon--plus" aria-hidden="true"></span>
                </button>
              </div>
              <div class="btn_language"></div>

              <div class="header_button active">고대비</div>
              <div class="header_button">화면 내리기</div>
              <div class="header_button">화면확대</div>
              <div class=" btn_call_employee">
                <div class="icon"></div>
                <div class="text">직원호출</div>
              </div>
            </div>
          </div>
          <div class="header-sub">
            <div class="progress-steps">
              <div class="progress-step progress-step--completed" aria-current="step">
                <div class="progress-step__index"><span><strong>1</strong></span></div>
                <div class="progress-step__label">음료 선택</div>
              </div>
              <div class="step-divider"></div>
              <div class="progress-step progress-step--completed">
                <div class="progress-step__index"><span><strong>2</strong></span></div>
                <div class="progress-step__label">내역 확인</div>
              </div>
              <div class="step-divider"></div>
              <div class="progress-step progress-step--completed">
                <div class="progress-step__index"><span><strong>3</strong></span></div>
                <div class="progress-step__label">결제하기</div>
              </div>
              <div class="step-divider"></div>
              <div class="progress-step progress-step--current">
                <div class="progress-step__index"><span><strong>4</strong></span></div>
                <div class="progress-step__label">결제 완료</div>
              </div>
              <div class="step-divider"></div>
              <div class="progress-step">
                <div class="progress-step__index"><span><strong>5</strong></span></div>
                <div class="progress-step__label">음료 추출</div>
              </div>
            </div>
          </div>
        </div>

        <main class="main">
          <div class="main-inner">
            <div class="main_with_title">
              <div class="title_comp">포인트 적립을위해 전화번호를 입력하세요</div>
              <div class="point_input_comp">
                <div class="phone_number_comp">
                  <div class="phone-input__area">
                    <input type="text" id="phoneInput" class="phone-input__field" value="010 - **** - 1234" readonly>
                  </div>
                  <div class="guide">
                    <span class="b_color">62</span>P 적립 예정
                  </div>
                  <div class="desc">
                    적립하지 않은 포인트는 소멸됩니다.
                  </div>
                </div>
                <div class="phone-keypad">
                  <button class="phone-keypad__button">1</button>
                  <button class="phone-keypad__button">2</button>
                  <button class="phone-keypad__button">3</button>
                  <button class="phone-keypad__button">4</button>
                  <button class="phone-keypad__button">5</button>
                  <button class="phone-keypad__button">6</button>
                  <button class="phone-keypad__button">7</button>
                  <button class="phone-keypad__button">8</button>
                  <button class="phone-keypad__button">9</button>
                  <button class="phone-keypad__button type2" data-action="delete">
                    <span class="keyboard__button__icon--delete" aria-hidden="true"></span>
                    지우기
                  </button>
                  <button class="phone-keypad__button">0</button>
                  <button class="phone-keypad__button type2" data-action="clear">
                    모두<br>지우기
                  </button>
                </div>

              </div>
              <div class="nav-btn-layer">
                <div class="button button_border_wh w-300 h-110">
                  건너뛰기
                </div>
                <button class="button_border_bl w-300 h-110">
                  적립하기
                </button>
              </div>
            </div>
          </div>
        </main>

      </div>
    </div>
  </div>

  <script>
    const input = document.getElementById("phoneInput");
    const buttons = document.querySelectorAll(".phone-keypad__button");
    const toggleEye = document.getElementById("toggleEye");
    let phoneValue = "";

    function formatPhone(num) {
      num = num.replace(/[^0-9]/g, "");
      if (num.length < 4) return num;
      if (num.length < 8) return num.replace(/(\d{3})(\d{1,4})/, "$1 - $2");
      return num.replace(/(\d{3})(\d{4})(\d{1,4})/, "$1 - $2 - $3");
    }

    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const action = btn.dataset.action;
        const val = btn.textContent.trim().replace(/[^0-9]/g, '');

        if (action === "delete") {
          phoneValue = phoneValue.slice(0, -1);
        } else if (action === "clear") {
          phoneValue = "";
        } else if (val) {
          if (phoneValue.length < 11) {
            phoneValue += val;
          }
        }
        input.value = formatPhone(phoneValue);
      });
    });

  </script>

</body>

</html>
