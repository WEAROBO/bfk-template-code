<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../resources/css/index.css">
  <title>5_장바구니</title>
</head>

<body class="lower-screen high-contrast">
  <div class="container-wrap">
    <div class="container">
      <div class="container-before">
        <div class="low_guide">
          <div class="container-before__title">NIA 한국지능정보사회진흥원</div>
          <div class="container-before__desc">화면 내리기 사용중</div>
        </div>
        <div class="container-before__guide">원하시는 메뉴를 선택하고 [주문하기]를 눌러주세요</div>
      </div>

      <div class="container-body">

        <div class="header">
          <div class="header--main">
            <div class="button icon-btn h-80 w-240">
              <div class="icon home-icon"></div>
              <div class="text">처음으로</div>
            </div>
            <div class="header__actions">
              <div class="control-bar__sound">
                <button type="button" class="control-bar__sound-button" aria-label="음량 줄이기">
                  <span class="control-bar__sound-icon control-bar__sound-icon--minus" aria-hidden="true"></span>
                </button>
                <div class="control-bar__sound-status">
                  <span class="control-bar__sound-icon control-bar__sound-icon--volume" aria-hidden="true"></span>
                  <span class="control-bar__sound-level" aria-live="polite">5</span>
                </div>
                <button type="button" class="control-bar__sound-button" aria-label="음량 키우기">
                  <span class="control-bar__sound-icon control-bar__sound-icon--plus" aria-hidden="true"></span>
                </button>
              </div>
              <div class="btn_language"></div>
              <div class="header_button active">고대비</div>
              <div class="header_button active">화면 내리기</div>
              <div class="header_button">화면확대</div>
              <div class=" btn_call_employee">
                <div class="icon"></div>
                <div class="text">직원호출</div>
              </div>
            </div>
          </div>
          <div class="header-sub">
            <div class="progress-steps">
              <div class="progress-step progress-step--current" aria-current="step">
                <div class="progress-step__index"><span><strong>1</strong></span></div>
                <div class="progress-step__label">음료 선택</div>
              </div>
              <div class="step-divider"></div>
              <div class="progress-step">
                <div class="progress-step__index"><span><strong>2</strong></span></div>
                <div class="progress-step__label">내역 확인</div>
              </div>
              <div class="step-divider"></div>
              <div class="progress-step">
                <div class="progress-step__index"><span><strong>3</strong></span></div>
                <div class="progress-step__label">결제하기</div>
              </div>
              <div class="step-divider"></div>
              <div class="progress-step">
                <div class="progress-step__index"><span><strong>4</strong></span></div>
                <div class="progress-step__label">결제 완료</div>
              </div>
              <div class="step-divider"></div>
              <div class="progress-step">
                <div class="progress-step__index"><span><strong>5</strong></span></div>
                <div class="progress-step__label">음료 추출</div>
              </div>
            </div>
          </div>
        </div>

        <main class="main">
          <div class="main-inner">
            <div class="product-select-comp">
              <div class="product-select-left product-area">
                <div class="left">

                  <div class="product-category-list">
                    <div class="category-item active">전체</div>
                    <div class="category-item">핫</div>
                    <div class="category-item">아이스</div>
                    <div class="category-item">커피</div>
                    <div class="category-item">논커피</div>
                  </div>

                  <div class="product-list">
                    <div class="product-item">
                      <div class="icon_area">
                        <div class="icon americano"></div>
                      </div>
                      <div class="status_img">
                        <div class="ice"></div>
                      </div>
                      <div class="name_area">
                        <div class="name">아메리카노</div>
                        <div class="price">1,100원</div>
                      </div>
                    </div>
                    <div class="product-item">
                      <div class="icon_area">
                        <div class="icon cafe_latte"></div>
                      </div>
                      <div class="status_img">
                        <div class="ice"></div>
                      </div>
                      <div class="name_area">
                        <div class="name">카페라떼</div>
                        <div class="price">1,100원</div>
                      </div>
                    </div>
                    <div class="product-item">
                      <div class="icon_area">
                        <div class="icon espreso"></div>
                      </div>
                      <div class="status_img">
                        <div class="hot"></div>
                      </div>
                      <div class="name_area">
                        <div class="name">에스프레소</div>
                        <div class="price">1,100원</div>
                      </div>
                    </div>
                    <div class="product-item">
                      <div class="icon_area">
                        <div class="icon camomile"></div>
                      </div>
                      <div class="status_img">
                        <div class="hot"></div>
                      </div>
                      <div class="name_area">
                        <div class="name">캐모마일 티</div>
                        <div class="price">1,100원</div>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="pagination-area-column lower">
                  <div class="pagination-comp updown">
                    <div class="button pagination-top pagination__btn h74 disabled">
                      <div class="arrow-icon"></div>
                    </div>
                    <div class="pagination__cnt">
                      <div class="pagination__current">1</div>
                      <div class="pagination__divider">/</div>
                      <div class="pagination__total">3</div>
                    </div>
                    <div class="button pagination-down pagination__btn h74 ">
                      <div class="arrow-icon"></div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="product-select-divider-area">
                <div class="product-select-divider"></div>
              </div>

              <div class="product-select-right">
                <div class="top_area">
                  <div class="btn_basket_text">
                    <div class="icon"></div>
                    <div class="text">장바구니</div>
                    <div class="cnt center">1</div>
                  </div>
                  <div class="count_comp">
                    <div class="line">
                      <div class="label">수량</div>
                      <div class="value">1개</div>
                    </div>
                    <div class="line">
                      <div class="label">금액</div>
                      <div class="value b_color">1,100원</div>
                    </div>
                  </div>
                </div>
                <div class="bottom_area">
                  <div class="button main-button order">주문하기</div>
                </div>
              </div>
            </div>
          </div>
        </main>

      </div>
    </div>

    <div class="popup position-center">
      <div class="popup-bg"></div>
      <div class="basket__popup popup-body">
        <div class="basket-area">
          <div class="basket-comp">
            <div class="basket-title-comp">
              <div class="basket-title">장바구니</div>
              <div class="button delete_all_btn">
                <div class="text">전체삭제</div>
              </div>
            </div>
            <div class="basket-list-comp">
              <div class="basket-list">
                <div class="basket-list-item">
                  <div class="s_line">
                    <div class="name">아메리카노(ICE)</div>
                    <div class="price">1,100원</div>
                    <div class="control-bar__product">
                      <button type="button" class="control-bar__product-button" aria-label="개수 줄이기" disabled>
                        <span class="control-bar__product-icon control-bar__product-icon--minus"
                          aria-hidden="true"></span>
                      </button>
                      <div class="control-bar__product-status">
                        <span class="control-bar__product-level" aria-live="polite">1</span>
                      </div>
                      <button type="button" class="control-bar__product-button" aria-label="개수 늘리기">
                        <span class="control-bar__product-icon control-bar__product-icon--plus"
                          aria-hidden="true"></span>
                      </button>
                    </div>
                    <div class="button product_delete_btn">
                      <div class="icon"></div>
                    </div>
                  </div>
                </div>
                <div class="basket-list-divider-area">
                  <div class="basket-list-divider">
                  </div>
                </div>
                <div class="basket-list-item">
                  <div class="s_line">
                    <div class="name">바닐라라떼(ICE)</div>
                    <div class="price">1,100원</div>
                    <div class="control-bar__product">
                      <button type="button" class="control-bar__product-button" aria-label="개수 줄이기" disabled>
                        <span class="control-bar__product-icon control-bar__product-icon--minus"
                          aria-hidden="true"></span>
                      </button>
                      <div class="control-bar__product-status">
                        <span class="control-bar__product-level" aria-live="polite">1</span>
                      </div>
                      <button type="button" class="control-bar__product-button" aria-label="개수 늘리기">
                        <span class="control-bar__product-icon control-bar__product-icon--plus"
                          aria-hidden="true"></span>
                      </button>
                    </div>
                    <div class="button product_delete_btn">
                      <div class="icon"></div>
                    </div>
                  </div>
                </div>
                <div class="basket-list-divider-area">
                  <div class="basket-list-divider">
                  </div>
                </div>
                <div class="basket-list-item">
                  <div class="s_line">
                    <div class="name">에스프레소</div>
                    <div class="price">1,100원</div>
                    <div class="control-bar__product">
                      <button type="button" class="control-bar__product-button" aria-label="개수 줄이기" disabled>
                        <span class="control-bar__product-icon control-bar__product-icon--minus"
                          aria-hidden="true"></span>
                      </button>
                      <div class="control-bar__product-status">
                        <span class="control-bar__product-level" aria-live="polite">1</span>
                      </div>
                      <button type="button" class="control-bar__product-button" aria-label="개수 늘리기">
                        <span class="control-bar__product-icon control-bar__product-icon--plus"
                          aria-hidden="true"></span>
                      </button>
                    </div>
                    <div class="button product_delete_btn">
                      <div class="icon"></div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="pagination-area-column lower">
                <div class="pagination-comp updown">
                  <div class="button pagination-top pagination__btn h74 disabled">
                    <div class="arrow-icon"></div>
                  </div>
                  <div class="pagination__cnt">
                    <div class="pagination__current">1</div>
                    <div class="pagination__divider">/</div>
                    <div class="pagination__total">2</div>
                  </div>
                  <div class="button pagination-down pagination__btn h74 ">
                    <div class="arrow-icon"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="button_area">
          <div class="button btn_popup_close button_border_wh btn_cancel w-300 h-110">
            <div class="icon"></div>
            <div class="text">닫기</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
