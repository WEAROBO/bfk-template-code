<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../resources/css/index.css">
  <title>1_메인</title>
</head>

<body class="lower-screen high-contrast">
  <div class="container-wrap">
    <div class="container">
      <div class="container-before">
        <div class="low_guide">
          <div class="container-before__title">NIA 한국지능정보사회진흥원</div>
          <div class="container-before__desc">화면 내리기 사용중</div>
        </div>
        <div class="container-before__guide">주문을 원하시면 시작하기를 눌러주세요</div>
      </div>

      <div class="container-body">

        <div class="header">
          <div class="header--main">
            <div class="header__position">
              <span class="icon location"></span>
              <span class="text">성수역 3번출구</span>
            </div>
            <div class="header__actions">
              <div class="control-bar__sound">
                <button type="button" class="control-bar__sound-button" aria-label="음량 줄이기">
                  <span class="control-bar__sound-icon control-bar__sound-icon--minus" aria-hidden="true"></span>
                </button>
                <div class="control-bar__sound-status">
                  <span class="control-bar__sound-icon control-bar__sound-icon--volume" aria-hidden="true"></span>
                  <span class="control-bar__sound-level" aria-live="polite">5</span>
                </div>
                <button type="button" class="control-bar__sound-button" aria-label="음량 키우기">
                  <span class="control-bar__sound-icon control-bar__sound-icon--plus" aria-hidden="true"></span>
                </button>
              </div>
              <div class="btn_language"></div>
              <div class="header_button active">고대비</div>
              <div class="header_button active">화면 내리기</div>
              <div class="header_button">화면확대</div>
              <div class=" btn_call_employee">
                <div class="icon"></div>
                <div class="text">직원호출</div>
              </div>
            </div>
          </div>
        </div>

        <main class="main">
          <div class="main_guide">
            <div class="guide_comp">
              <div class="guide_title_area">
                <div class="guide_title">무인카페 이용방법</div>
              </div>
              <div class="guide_list">
                <div class="guide_item">
                  <div class="guide_index">1단계</div>
                  <div class="guide_text">메뉴 <br /> 선택하기</div>
                </div>
                <div class="guide_item">
                  <div class="guide_index">2단계</div>
                  <div class="guide_text">내역 확인 <br /> 및 결제하기</div>
                </div>
                <div class="guide_item">
                  <div class="guide_index">3단계</div>
                  <div class="guide_text">컵 빼서 <br />머신앞에 놓기</div>
                </div>
                <div class="guide_item">
                  <div class="guide_index">4단계</div>
                  <div class="guide_text">음료 나올 때 까지 <br />기다리기</div>
                </div>
              </div>
            </div>
            <div class="title_comp">
              <div class="title">주문을 원하시면 <br /> 시작하기를 눌러주세요</div>
              <div class="button main-button">시작하기</div>
            </div>
          </div>
        </main>

      </div>
    </div>
  </div>
</body>

</html>
